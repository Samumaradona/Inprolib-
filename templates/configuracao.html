<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>INPROLIB - Configurações</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/configuracao.css') }}?v={{ asset_version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/topbar.css') }}?v={{ asset_version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}?v={{ asset_version }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-dark.css') }}?v={{ asset_version }}">
  <script src="{{ url_for('static', filename='javascript/theme.js') }}?v={{ asset_version }}"></script>
  <style>
    /* Ícone de mostrar/ocultar senha — escopo desta página */
    .password-wrapper{ position:relative; display:flex; align-items:center; }
    .password-wrapper input[type="password"], .password-wrapper input[type="text"]{ padding-right:40px; }
    .password-toggle{ position:absolute; right:10px; top:50%; transform:translateY(-50%); background:transparent; border:0; cursor:pointer; width:24px; height:24px; display:flex; align-items:center; justify-content:center; color:#64748b; }
    .password-toggle:hover{ color:#4c5d9b; }
  </style>
</head>
<body>
  <div id="app">
<header class="topbar">
  <div class="container">
    <!-- LADO ESQUERDO: apenas hambúrguer -->
    <div class="left">
      <button class="hamburger" id="btnHamburger" aria-controls="sideMenu" aria-expanded="false" aria-label="Abrir menu" title="Abrir menu">
        <span class="material-symbols-outlined" aria-hidden="true">menu</span>
      </button>
            <div class="profile-wrap" style="position:relative">
        <button id="btnProfile" class="profile-btn" aria-haspopup="true" aria-expanded="false" aria-label="Abrir menu do usuário">
<img id="profileAvatar" class="avatar" src="{{ avatar_url }}" alt="Avatar usuário" decoding="async">
        </button>
        <div id="profileDropdown" class="dropdown-menu" role="menu" aria-hidden="true">
          <button id="viewPhoto" class="dropdown-action" role="menuitem">Ver foto</button>
          <button id="changePhoto" class="dropdown-action" role="menuitem">Mudar foto</button>
        </div>
        <input id="fileAvatarInput" type="file" accept="image/*" style="display:none" aria-hidden="true">
      </div>
      <div>
        <p id="username">{{ session.get('user_name', '') }}</p>
      </div>
    </div>
    <!-- LADO DIREITO: notificações + avatar -->
    <div class="right" role="group" aria-label="Ações do usuário">
      <!-- Notification button -->
      <div class="notif-wrap" style="position:relative">
        <button id="btnNotifications" class="notif-btn" aria-haspopup="true" aria-expanded="false" aria-label="Notificações">
          <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
          <span id="notifBadge" class="notif-badge" aria-hidden="true" style="display:none"></span>
        </button>
        <div id="notificationsDropdown" class="dropdown-menu" role="menu" aria-hidden="true">
          <div class="dropdown-item">Você não tem novas notificações</div>
        </div>
      </div>
      <!-- profile avatar -->
    </div>
  </div>
</header>
<!-- modal de visualização da foto -->
<div id="avatarModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="avatarModalTitle">
  <div class="modal-content">
    <button id="closeModal" class="modal-close" aria-label="Fechar visualização">✕</button>
    <h3 id="avatarModalTitle" style="margin:0 0 12px 0">Foto do usuário</h3>
    <img id="modalAvatarImg" src="" alt="Foto do usuário" style="max-width:100%;border-radius:8px" loading="lazy" decoding="async">
  </div>
</div>
    <!-- Backdrop e menu lateral -->
    <div id="backdrop" class="backdrop" tabindex="-1" aria-hidden="true"></div>

    <aside id="sideMenu" class="sidemenu" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sideMenuTitle">
      <header>
        <div>
          <strong id="sideMenuTitle">INPROLIB</strong>
          <div style="font-size:12px;color:#64748b">Menu</div>
        </div>
        <div>
          <button id="btnClose" aria-label="Fechar menu" title="Fechar">✕</button>
        </div>
      </header>
      <nav class="routes" id="routesList">
        <!-- rotas inseridas por JS -->
      </nav>
      <footer>
        <a id="logoutBtn" class="route" href="/logout"><span class="material-symbols-outlined">logout</span>Sair</a>
      </footer>
    </aside>

    <main>
      <section class="content" style="padding:16px">
        <h2 style="margin:0 0 12px 0">Configurações</h2>
        <div class="container-grid">
          <div>
            <h3>Editar Perfil</h3>
            <form id="formPerfil" action="/configuracao/perfil" method="post" class="form-container" autocomplete="on">
              <label for="usuarioSelect">Selecionar usuário</label>
              <select id="usuarioSelect" name="id_usuario" required>
                <option value="">Selecione um usuário</option>
                {% for u in (usuarios or []) %}
                  <option value="{{ u.id_usuario }}" {% if user and (u.id_usuario == user.id_usuario) %}selected{% endif %}>{{ u.nome }}</option>
                {% endfor %}
              </select>

              <label for="nome">Nome completo</label>
              <input type="text" id="nome" name="nome" placeholder="Seu nome" value="{{ (user.nome if user) or '' }}" required>

              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" placeholder="Seu e-mail" value="{{ (user.email if user) or '' }}" required>

              <div style="display:flex;gap:8px;margin-top:8px">
                <button type="submit" class="button">Salvar Alterações</button>
                <button type="button" id="btnChangePhotoInline" class="button with-icon"><span class="material-symbols-outlined">photo_camera</span>Mudar foto</button>
              </div>
            </form>
          </div>

          <!-- Bloco de Alteração de Senha removido (usar recuperar senha na tela de login) -->

          <div class="full-width">
            <h3>Tema Visual</h3>
            <form id="formTema" action="/configuracao/tema" method="post" class="form-container">
              <div style="display:flex;align-items:center;gap:12px">
                <label class="switch-label" for="toggleTema" style="display:flex;align-items:center;gap:8px">
                  <input type="checkbox" id="toggleTema" name="toggleTema" {{ 'checked' if (session.get('user_theme')=='escuro') else '' }}>
                  <span>Ativar modo escuro</span>
                </label>
                <span id="temaAtual" style="color:#64748b">Tema atual: {{ (session.get('user_theme') or 'claro') }}</span>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    window.USER_ROLE = "{{ (session.get('role') or session.get('user_tipo') or '') }}";
window.USER_PHOTO = "{{ avatar_url }}";
window.USER_ID = "{{ session.get('user_id', '') }}";
window.USER_THEME = "{{ (session.get('user_theme') or 'claro') }}";
  </script>
 <script src="{{ url_for('serve_js', script_name='notifications') }}?v={{ asset_version }}"></script>
 <script src="{{ url_for('serve_js', script_name='home') }}?v={{ asset_version }}"></script>
  <!-- password-toggle removido por não haver mais campos de senha -->
  <script>
    window.initFlashToasts && window.initFlashToasts();
    (function(){
      const formPerfil = document.getElementById('formPerfil');
      const toggleTema = document.getElementById('toggleTema');
      const temaAtual = document.getElementById('temaAtual');
      const btnChangePhotoInline = document.getElementById('btnChangePhotoInline');
      const fileAvatarInput = document.getElementById('fileAvatarInput');

      // elementos do formulário de perfil
      const usuarioSelect = document.getElementById('usuarioSelect');
      const nomeInput = document.getElementById('nome');
      const emailInput = document.getElementById('email');

      function toastOk(msg){ window.showToast ? window.showToast('success', msg) : alert(msg); }
      function toastErr(msg){ window.showToast ? window.showToast('error', msg) : alert(msg); }

      if(formPerfil){
        const submitBtn = formPerfil.querySelector('button[type="submit"]');
        formPerfil.addEventListener('submit', async (e)=>{
          e.preventDefault();
          const fd = new FormData(formPerfil);
          try{
            submitBtn && (submitBtn.disabled = true, submitBtn.textContent = 'Salvando...');
            const res = await fetch(formPerfil.action, {
              method: 'POST',
              body: fd,
              headers: { 'X-Requested-With':'XMLHttpRequest', 'Accept':'application/json' },
              credentials: 'same-origin'
            });
            const data = await res.json().catch(()=>null);
            if(data && data.ok){
              if(window.clearToasts) window.clearToasts();
              toastOk(data.message || 'Perfil atualizado com sucesso.');
              // Após sucesso, redireciona para Home com pequeno delay
              setTimeout(()=>{ window.location.href = '/home'; }, 1200);
            } else {
              const msg = (data && data.error) || 'Falha ao atualizar perfil.';
              toastErr(msg);
              if(!window.showToast) alert(msg);
            }
          }catch(err){
            const msg = 'Erro de conexão ao salvar perfil.';
            toastErr(msg);
            if(!window.showToast) alert(msg);
          } finally {
            submitBtn && (submitBtn.disabled = false, submitBtn.textContent = 'Salvar Alterações');
          }
        });
      }

      // Preenche campos ao selecionar um usuário
      if(usuarioSelect){
        usuarioSelect.addEventListener('change', async ()=>{
          const id = usuarioSelect.value;
          if(!id){ return; }
          try{
            const res = await fetch(`/api/usuario/${id}`, { headers: { 'X-Requested-With':'XMLHttpRequest' } });
            const data = await res.json();
            if(data && data.ok && data.user){
              nomeInput && (nomeInput.value = data.user.nome || '');
              emailInput && (emailInput.value = data.user.email || '');
            } else {
              toastErr((data && data.error) || 'Não foi possível carregar dados do usuário.');
            }
          }catch(err){ toastErr('Erro de conexão ao carregar usuário.'); }
        });
      }

      // Removido comportamento relacionado a alteração de senha

      if(toggleTema){
        toggleTema.addEventListener('change', async ()=>{
          const tema = toggleTema.checked ? 'escuro' : 'claro';
          try{
            const fd = new FormData(); fd.append('tema', tema);
            const res = await fetch('/configuracao/tema', { method:'POST', body: fd, headers: { 'X-Requested-With':'XMLHttpRequest' } });
            const data = await res.json();
            if(data && data.ok){
              temaAtual.textContent = 'Tema atual: ' + (data.tema || tema);
              // atualiza classe/variáveis via home.js se existir suporte
              if(window.applyTheme){ window.applyTheme(data.tema || tema); }
              toastOk('Tema atualizado.');
            } else {
              toastErr((data && data.error) || 'Não foi possível atualizar o tema.');
              toggleTema.checked = ((window.USER_THEME || 'claro') === 'escuro');
            }
          }catch(err){ toastErr('Erro de conexão ao salvar tema.'); }
        });
      }

      if(btnChangePhotoInline && fileAvatarInput){
        btnChangePhotoInline.addEventListener('click', ()=>{ fileAvatarInput && fileAvatarInput.click(); });
      }
    })();
  </script>
</body>
</html>
