services:
  - type: web
    name: inprolib-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_SETUP_TOKEN
        sync: false
      - key: ADMIN_TEMP_PASSWORD
        sync: false
      - key: RESET_TOKEN_EXP_SECONDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: public
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: INPROLIB
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_TIMEOUT
        value: 8
      - key: SMTP_DEBUG
        value: 0
      - key: SUPPORT_EMAIL
        value: suporteinprolib@gmail.com
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2 --threads 4
    disk:
      name: uploads
      mountPath: static/uploads
      sizeGB: 1