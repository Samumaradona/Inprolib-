services:
  - type: web
    name: inprolib-web
    env: python
    buildCommand: pip install -r requirements.txt
    # Ajuste para conexões SSE estáveis (evita CRITICAL WORKER TIMEOUT)
    # timeout 120s é mais robusto em alguns ambientes do que 0 (ilimitado)
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 2 --threads 20 --timeout 120 --graceful-timeout 60 --keep-alive 75"
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_SETUP_TOKEN
        sync: false
      - key: UPLOAD_SYNC_TOKEN
        sync: false
      - key: ADMIN_TEMP_PASSWORD
        sync: false
      - key: RESET_TOKEN_EXP_SECONDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: public
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: INPROLIB
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_TIMEOUT
        value: 8
      - key: SMTP_DEBUG
        value: 0
      - key: SUPPORT_EMAIL
        value: suporteinprolib@gmail.com
    # Removido segundo startCommand duplicado; acima está a configuração única de execução
    disk:
      name: uploads
      mountPath: /opt/render/project/src/static/uploads
      sizeGB: 1